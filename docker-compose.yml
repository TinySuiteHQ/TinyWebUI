# Builds the default image (hybrid search). The embedding model is downloaded
# at build time, so the build needs internet access.
#
#   docker compose up --build
services:
  tinywebui:
    build: .
    image: tinywebui
    ports:
      - "127.0.0.1:7777:7777"
    volumes:
      # Holds the database, owner password hash, settings and session secret.
      - tinywebui-data:/data
    restart: unless-stopped

volumes:
  tinywebui-data:
