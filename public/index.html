<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinyWebUI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <button id="menu" aria-label="Show chat history" aria-expanded="false" aria-controls="side">=</button>
  <h1>TinyWebUI</h1>
  <span id="status" role="status" aria-live="polite"></span>
  <span class="grow"></span>
  <button id="toggle-settings">settings</button>
  <button id="toggle-automations">automations</button>
  <button id="toggle-statistics">statistics</button>
</header>

<div id="shell">

<div id="side-backdrop"></div>

<aside id="side" aria-label="Chat history">
  <div class="head"><button id="new">+ new chat</button><button id="newFolder">+ new folder</button></div>
  <div class="search-row">
    <input id="chatSearch" type="search" placeholder="search chats…" aria-label="Search chats" autocomplete="off" spellcheck="false">
    <button id="chatSearchClear" class="x" type="button" aria-label="Clear search" hidden>×</button>
  </div>
  <div id="chats"></div>
  <div id="side-resize" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="Resize chat history" title="Drag to resize, double-click to reset"></div>
</aside>

<dialog id="organizeDialog" aria-labelledby="organizeTitle">
  <form id="organizeForm">
    <h2 id="organizeTitle">Chat options</h2>
    <label for="organizeFolder">folder</label>
    <select id="organizeFolder">
      <option value="">(no folder)</option>
    </select>
    <div id="organizeError" class="organize-error" role="alert" hidden></div>
    <div class="dialog-actions">
      <button type="button" id="organizeDelete" class="danger">delete chat</button>
      <button type="button" id="organizeCancel">cancel</button>
      <button type="submit" class="primary">save</button>
    </div>
  </form>
</dialog>

<dialog id="newFolderDialog" aria-labelledby="newFolderTitle">
  <form id="newFolderForm">
    <h2 id="newFolderTitle">New folder</h2>
    <label for="newFolderName">name</label>
    <input id="newFolderName" maxlength="40" autocomplete="off" placeholder="Folder name">
    <div id="newFolderError" class="organize-error" role="alert" hidden></div>
    <div class="dialog-actions">
      <button type="button" id="newFolderCancel">cancel</button>
      <button type="submit" class="primary">create</button>
    </div>
  </form>
</dialog>

<main>
  <section id="settings">
    <div class="sec">
      <div class="sec-h">model</div>
      <div>
        <label for="systemPrompt">system prompt</label>
        <textarea id="systemPrompt" rows="6"></textarea>
      </div>
      <div class="row">
        <div><label for="model">model</label><input id="model" spellcheck="false"></div>
        <div><label for="temperature">temperature</label><input id="temperature" type="number" step="0.1" min="0" max="2" placeholder="provider default"></div>
        <div><label for="maxTokens">max tokens</label><input id="maxTokens" type="number" min="1" placeholder="no limit"></div>
        <div><label for="maxToolRounds">max tool turns</label><input id="maxToolRounds" type="number" min="1" max="50"></div>
        <div><label for="cacheTtl" title="Anthropic cache lifetime. 1h costs more to write but survives longer pauses.">cache ttl</label><select id="cacheTtl"><option value="5m">5 min</option><option value="1h">1 hour</option></select></div>
      </div>
      <div class="row">
        <div><label for="compactThreshold" title="Prompt size at which old tool results are compacted out of the window. 0 disables it.">compact above (tokens)</label><input id="compactThreshold" type="number" min="0" step="1000"></div>
        <div><label for="keepTurns" title="Recent user turns whose tool results are always kept in full.">keep last turns</label><input id="keepTurns" type="number" min="1" max="20"></div>
        <div><label for="maxInlineChars" title="A single tool result larger than this is stubbed on arrival.">stub above (chars)</label><input id="maxInlineChars" type="number" min="0" step="1000"></div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-h">appearance</div>
      <div class="row">
        <div><label for="theme">theme</label><select id="theme"><option value="">default</option></select></div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-h">mcp servers <span id="mcpPath" class="usage"></span></div>
      <textarea id="mcpText" rows="9" spellcheck="false"></textarea>
      <div class="row">
        <div id="mcpMsg" class="usage"></div>
        <div style="flex:0 0 auto"><button id="saveMcp">save &amp; reconnect</button></div>
      </div>
      <div>
        <label>tools <span id="toolCount" class="usage"></span></label>
        <div id="tools" class="tool-list"></div>
      </div>
    </div>
    <div class="sec-bar">
      <span id="saveMsg" class="usage"></span>
      <button id="cancel">close</button>
      <button class="primary" id="save">save settings</button>
    </div>
  </section>

  <section id="statistics" aria-label="Statistics">
    <div class="automation-head"><h2>Statistics</h2><button id="close-statistics">close</button></div>
    <div class="statistics-content">
      <section class="statistics-block">
        <div class="sec-h">cost and averages <span class="usage">provider-reported costs only</span></div>
        <div id="statisticsSummary" class="row"></div>
        <div id="statisticsCoverage" class="usage"></div>
        <div id="statisticsCosts" class="statistics-costs"></div>
      </section>
      <section class="statistics-block">
        <div class="sec-h">token usage <span id="usageRange" class="usage"></span></div>
        <div id="usageStats" class="row"></div>
        <div id="usageModels" class="usage-models"></div>
        <div id="usageBars" class="usage-bars"></div>
      </section>
    </div>
  </section>

  <section id="automations" aria-label="Automations">
    <div class="automation-head"><h2>Automations</h2><button id="close-automations">close</button></div>
    <div class="automation-content">
      <form id="automation-create" class="automation-form">
        <h3>New automation</h3>
        <label>name<input name="name" required maxlength="120"></label>
        <label>target chat<select name="chatId" required></select></label>
        <label>schedule (five-field cron)<input name="cron" required placeholder="0 9 * * 1-5"></label>
        <label>timezone (IANA)<input name="timezone" required placeholder="Europe/Berlin"></label>
        <label>instructions<textarea name="prompt" required maxlength="12000" rows="5"></textarea></label>
        <div class="automation-error" role="alert"></div>
        <button class="primary" type="submit">create automation</button>
      </form>
      <div id="automation-list" class="automation-list"></div>
    </div>
  </section>

  <div id="log"><div class="wrap" id="wrap"></div></div>

  <aside id="rightRail" class="right-rail">
    <div id="chatDocs" class="rail-card" hidden></div>
  </aside>

  <aside id="chatOutline" class="outline-rail" hidden></aside>

  <footer>
    <div id="attachments" class="attachments" hidden></div>
    <form id="form">
      <input type="file" id="fileInput" multiple hidden>
      <button type="button" id="attach" title="attach a file">📎</button>
      <textarea id="input" rows="1" placeholder="message (enter to send, shift+enter for newline)"></textarea>
      <button class="primary" id="send" type="submit">send</button>
    </form>
  </footer>
</main>

</div>

<script type="module" src="themes/theme-loader.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
