name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Check the default install path and the model the server loads.
      - run: node bin/tinywebui.js models ensure
      - run: node bin/tinywebui.js models verify | tee verify.json
      - run: |
          grep -q '"mode": "hybrid"' verify.json
