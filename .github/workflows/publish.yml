name: publish

on:
  push:
    tags: ['v*']
  # Builds the Docker images of a version already on npm, without publishing to npm:
  # to backfill one, or to rebuild it for base-image security fixes.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build the images from, for example v0.2.1 (must already be on npm)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@^11
      - name: Check release tag
        run: |
          node -e "const p=require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v' + p.version) { console.error('Tag must match package version: v' + p.version); process.exit(1) }"
      - run: npm ci
      - run: npm test
      # The package ships JS emitted from the .ts sources (prepack runs `npm run build`);
      # install the packed tarball and run it from node_modules, where Node won't strip types.
      - name: Check the packed package runs
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npm init -y > /dev/null
          npm install --omit=optional --ignore-scripts ./tinywebui-*.tgz
          npx tinywebui schema > /dev/null
          TINYWEBUI_CONFIG="$RUNNER_TEMP/smoke.config.json" TINYWEBUI_DB="$RUNNER_TEMP/smoke.db" \
            TINYWEBUI_RETRIEVAL_MODE=lexical npx tinywebui --port 7799 &
          for i in $(seq 30); do curl -fs http://127.0.0.1:7799/readyz && break; sleep 1; done
          curl -fs http://127.0.0.1:7799/readyz
          # The page ships prebuilt: the index and the script it names must both be there.
          page=$(curl -fs http://127.0.0.1:7799/)
          script=$(echo "$page" | grep -o '/assets/[^"]*\.js' | head -1)
          test -n "$script" && curl -fs -o /dev/null "http://127.0.0.1:7799$script"
          kill %1
      - run: npm publish --access public

  # After the npm job, so an image is only published from a tag whose tests passed.
  # A manual run skips that job (!failure() lets this one run after a skip) and
  # checks instead that the version is already on npm.
  # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are organisation secrets, shared with
  # TinySearch and TinyContext.
  docker:
    name: Docker image (${{ matrix.variant }})
    needs: npm
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write   # keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: hybrid
            dockerfile: Dockerfile
            suffix: ''
            latest: latest
          - variant: light
            dockerfile: Dockerfile.lexical
            suffix: '-light'
            latest: light
    env:
      IMAGE_NAME: marcellm01/tinywebui
    steps:
      - name: Check the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = push ]; then version="$GITHUB_REF_NAME"; else version="$INPUT"; fi
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Not a release tag: $version"; exit 1
          fi
          if [ "$EVENT" != push ]; then
            npm view "tinywebui@${version#v}" version > /dev/null 2>&1 \
              || { echo "::error::tinywebui@${version#v} is not on npm"; exit 1; }
            npm_latest=$(npm view tinywebui dist-tags.latest)
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "npm_latest=${npm_latest:-}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.version.outputs.value }}

      - name: Check the tag matches package.json
        id: source
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          node -e "const p=require('./package.json'); if (process.env.VERSION !== 'v' + p.version) { console.error('Tag must match package version: v' + p.version); process.exit(1) }"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # v0.2.0 -> :v0.2.0 (+ :latest), or :v0.2.0-light (+ :light). The moving tag
      # never points at a pre-release (v0.3.0-rc.1), and a manual run moves it only
      # for npm's latest version, so rebuilding an older one never takes it backwards.
      - name: Set image tags
        id: tags
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.version.outputs.value }}
          NPM_LATEST: ${{ steps.version.outputs.npm_latest }}
          SUFFIX: ${{ matrix.suffix }}
          LATEST: ${{ matrix.latest }}
        run: |
          case "$VERSION" in
            *-*) move=no ;;
            *) if [ "$EVENT" = push ] || [ "$VERSION" = "v$NPM_LATEST" ]; then move=yes; else move=no; fi ;;
          esac
          {
            echo "value<<EOF"
            echo "${IMAGE_NAME}:${VERSION}${SUFFIX}"
            if [ "$move" = yes ]; then echo "${IMAGE_NAME}:${LATEST}"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # security.yml runs these on the tag too, but beside this job, not before it.
      - name: Scan the Dockerfile for misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.dockerfile }}
          scanners: misconfig
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Scan the repository for secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          skip-dirs: .git,node_modules,models
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.5.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build for the vulnerability scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Scan image for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_CONFIG_SCANNERS: secret
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          scanners: vuln,secret
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.tags.outputs.value }}
          labels: |
            org.opencontainers.image.title=TinyWebUI${{ matrix.suffix }}
            org.opencontainers.image.description=Chat UI for any OpenAI-compatible endpoint, with MCP tools
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - uses: sigstore/cosign-installer@v3

      - name: Sign the published image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

      # Docker Hub never reads the README from GitHub, so this copies it there,
      # with relative links made absolute. Updating a description needs a token
      # with Read, Write, Delete access, kept apart from the push token; until
      # DOCKERHUB_DESCRIPTION_TOKEN exists this is skipped. Only a run that moves
      # :latest updates it, so rebuilding an older version never restores an older README.
      - name: Check for the Docker Hub description token
        id: description
        if: matrix.variant == 'hybrid' && contains(steps.tags.outputs.value, ':latest')
        env:
          TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::DOCKERHUB_DESCRIPTION_TOKEN is not set; the Docker Hub description was not updated"; fi

      - name: Update the Docker Hub description
        if: steps.description.outputs.enabled == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: A small, local-first chat UI for any OpenAI-compatible model, with MCP tools
          enable-url-completion: true

  record-deployment:
    name: Record npm deployment
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/tinywebui
    steps:
      - run: echo "Published $GITHUB_REF_NAME to npm"
