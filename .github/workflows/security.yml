name: security

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy security scans
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan repository configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Scan source dependencies and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          skip-dirs: .git,node_modules,models
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build default hybrid image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: tinywebui:security-scan

      - name: Scan image for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_CONFIG_SCANNERS: secret
        with:
          image-ref: tinywebui:security-scan
          scanners: vuln,secret
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
